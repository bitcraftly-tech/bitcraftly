# Sync production + staging env to Vercel. Run manually after VERCEL_TOKEN secret is set.
name: Configure production env

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync Vercel env (production + staging preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/configure-vercel-env.mjs
