# =============================================================================
# Bitcraftly Platform — Continuous Integration
# =============================================================================
# Jobs:
#   1. quality   — lint · typecheck · vitest (+ coverage) · build
#   2. e2e       — Playwright (Chromium desktop + mobile)
#   3. lighthouse — Lighthouse CI against production server
# =============================================================================

name: Bitcraftly CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'

concurrency:
  group: bitcraftly-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Prisma loads its datasource while evaluating prisma.config.ts, including for
# client generation. CI never connects to this placeholder database; staging
# and production continue to use environment-specific hosting secrets.
env:
  DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/bitcraftly_ci

jobs:
  quality:
    name: Lint · Typecheck · Unit · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build Next.js application
        run: npm run build
        env:
          CI: true
          NODE_ENV: production
          SKIP_ENV_VALIDATION: 'true'

  e2e:
    name: Playwright E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build Next.js application
        run: npm run build
        env:
          CI: true
          NODE_ENV: production
          SKIP_ENV_VALIDATION: 'true'

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_PORT: '3000'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build Next.js application
        run: npm run build
        env:
          CI: true
          NODE_ENV: production
          SKIP_ENV_VALIDATION: 'true'

      - name: Run Lighthouse CI
        run: npm run lighthouse:ci
        env:
          CI: true

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
