# One-click staging setup — run manually after adding VERCEL_TOKEN repo secret.
# GitHub → Settings → Secrets and variables → Actions → New repository secret
name: Setup staging.bitcraftly.com

on:
  workflow_dispatch:

jobs:
  setup-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Vercel domain + preview env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/setup-staging-live.mjs
