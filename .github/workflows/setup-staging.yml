# Auto-configure staging.bitcraftly.com on every development push (idempotent).
# One-time: add VERCEL_TOKEN to GitHub Secrets.
name: Setup staging.bitcraftly.com

on:
  workflow_dispatch:
  push:
    branches: [development]

jobs:
  setup-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Vercel domain + preview env (+ optional DNS)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NAMECHEAP_API_USER: ${{ secrets.NAMECHEAP_API_USER }}
          NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
          NAMECHEAP_USERNAME: ${{ secrets.NAMECHEAP_USERNAME }}
          NAMECHEAP_CLIENT_IP: ${{ secrets.NAMECHEAP_CLIENT_IP }}
        run: node scripts/setup-staging-live.mjs
